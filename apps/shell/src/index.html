<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stickerdex: Pokémon sticker book</title>
    <meta
      name="description"
      content="Browse every Pokémon as a die-cut sticker. Search by name, type or region."
    />
    <meta property="og:site_name" content="Stickerdex" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stickerdex-bay.vercel.app/" />
    <meta property="og:title" content="Stickerdex: Pokémon sticker book" />
    <meta
      property="og:description"
      content="Browse every Pokémon as a die-cut sticker. Search by name, type or region."
    />
    <meta
      property="og:image"
      content="https://stickerdex-bay.vercel.app/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Stickerdex wordmark under die-cut stickers of Gengar, Pikachu and Charizard"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stickerdex: Pokémon sticker book" />
    <meta
      name="twitter:description"
      content="Browse every Pokémon as a die-cut sticker. Search by name, type or region."
    />
    <meta
      name="twitter:image"
      content="https://stickerdex-bay.vercel.app/og-image.png"
    />
    <meta
      name="twitter:image:alt"
      content="Stickerdex wordmark under die-cut stickers of Gengar, Pikachu and Charizard"
    />
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="darkreader-lock" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#e9eefb"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#100e33"
    />
    <script>
      // Runs before first paint so a saved theme never flashes the other one.
      try {
        var savedTheme = localStorage.getItem('stickerdex.theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.dataset.theme = savedTheme;
          document
            .querySelectorAll('meta[name="theme-color"]')
            .forEach(function (meta) {
              meta.content = savedTheme === 'dark' ? '#100e33' : '#e9eefb';
            });
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://pokeapi.co" />
    <link rel="preconnect" href="https://raw.githubusercontent.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
    />
  </head>
  <body>
    <sd-root></sd-root>
  </body>
</html>
